syntax = "proto3";

// Versioned service name from Day 1 
package payflow.payment.v1;
option go_package = "payflow/proto/payment";

// Service for C1 Gateway to submit tasks to C2 Coordinator [cite: 76]
service PaymentGateway {
    // Accepts amount, currency, merchant_id, idempotency_key 
    rpc SubmitTask(SubmitTaskRequest) returns (SubmitTaskResponse);
    rpc SubmitBatch(SubmitBatchRequest) returns (SubmitBatchResponse);
    rpc GetPaymentStatus(GetStatusRequest) returns (GetStatusResponse);
}

message SubmitTaskRequest {
    // Every gRPC message carries an epoch number 
    int64 epoch = 1; 
    
    double amount = 2;
    string currency = 3;
    string merchant_id = 4;
    string idempotency_key = 5;
    
    // Reserve fields to prevent breaking changes 
    reserved 6 to 10;
}

message SubmitTaskResponse {
    // Returns txn_id 
    string txn_id = 1;
    
    // Using oneof for clean error/success handling 
    oneof result {
        bool success = 2;
        string error_message = 3;
        string leader_address = 4; // Used in C05: Leader Redirect
    }
}

message SubmitBatchRequest {
    int64 epoch = 1;
    repeated SubmitTaskRequest tasks = 2;
}

message SubmitBatchResponse {
    repeated SubmitTaskResponse responses = 1;
    string leader_address = 2;
}

message GetStatusRequest {
    int64 epoch = 1;
    string txn_id = 2;
}

message GetStatusResponse {
    string txn_id = 1;
    string status = 2;
    string leader_address = 3;
}