<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayFlow Monitor</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0d0d0d;
            color: #e0e0e0;
            font-family: "JetBrains Mono", "Fira Code", "Consolas", "Courier New", monospace;
            min-height: 100vh;
            padding: 16px;
        }

        /* ═══ HEADER ═══ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            margin-bottom: 16px;
        }
        .header-left h1 {
            font-size: 22px;
            color: #00ff88;
            text-shadow: 0 0 12px rgba(0,255,136,0.25);
        }
        .header-left .version {
            font-size: 11px;
            color: #555;
            margin-top: 2px;
        }
        .status-pill {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid #2a2a2a;
        }
        .status-live { background: #0a2e1a; color: #00ff88; border-color: #00ff88; }
        .status-stale { background: #2e2a0a; color: #f5a623; border-color: #f5a623; }
        .status-disconnected { background: #2e0a0a; color: #ff4444; border-color: #ff4444; }

        /* ═══ GRID LAYOUT ═══ */
        .main-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        @media (max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; }
        }
        .bottom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 768px) {
            .bottom-grid { grid-template-columns: 1fr; }
        }

        /* ═══ PANELS ═══ */
        .panel {
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 16px;
        }
        .panel-title {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #222;
        }

        /* ═══ COORDINATOR RING ═══ */
        .coord-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 8px;
            border-radius: 4px;
            margin-bottom: 6px;
            transition: opacity 0.3s ease;
        }
        .coord-row.dead { opacity: 0.4; }
        .coord-icon { font-size: 18px; width: 24px; text-align: center; }
        .coord-info { flex: 1; }
        .coord-name { font-size: 13px; color: #e0e0e0; }
        .coord-epoch { font-size: 11px; color: #666; margin-top: 2px; }

        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .badge-leader { background: #f5a623; color: #1a1a1a; }
        .badge-follower { background: #2d6ae0; color: #ffffff; }
        .badge-candidate {
            background: #e07d2d;
            color: #ffffff;
            animation: pulse 1.2s infinite;
        }
        .badge-dead { background: #c0392b; color: #ffffff; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .election-banner {
            display: none;
            background: #2e2a0a;
            border: 1px solid #f5a623;
            color: #f5a623;
            text-align: center;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 8px;
        }
        .election-banner.visible { display: block; }

        /* ═══ WORKER GRID ═══ */
        .worker-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
        }
        .worker-card {
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            padding: 12px;
            text-align: center;
            transition: background 0.4s ease, border-color 0.4s ease;
        }
        .worker-card.dead-border { border-color: #c0392b; }
        .worker-card.flash-alive { background: #1e2e1e; }
        .worker-card.flash-dead { background: #2e1e1e; }
        .worker-name { font-size: 12px; color: #aaa; margin-bottom: 6px; }
        .worker-badge { margin-bottom: 4px; }
        .badge-alive { background: #27ae60; color: #fff; }
        .badge-worker-dead { background: #c0392b; color: #fff; }
        .worker-stat { font-size: 11px; color: #666; margin-top: 3px; }

        /* ═══ QUEUE GAUGE ═══ */
        .queue-bar-container {
            background: #1e1e1e;
            border-radius: 4px;
            height: 28px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .queue-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.4s ease, background 0.3s ease;
            min-width: 0;
        }
        .queue-green { background: #27ae60; }
        .queue-amber { background: #f39c12; }
        .queue-red { background: #c0392b; }
        .queue-label { font-size: 12px; color: #888; text-align: center; }

        /* ═══ THROUGHPUT SPARKLINE ═══ */
        .throughput-container {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 60px;
            margin-bottom: 8px;
        }
        .spark-bar {
            width: 6px;
            min-height: 2px;
            background: #00ff88;
            border-radius: 1px 1px 0 0;
            transition: height 0.3s ease;
            opacity: 0.7;
        }
        .throughput-value {
            font-size: 20px;
            color: #00ff88;
            font-weight: bold;
            text-align: center;
        }
        .throughput-unit {
            font-size: 11px;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <h1>&#x2B21; PayFlow Monitor</h1>
            <div class="version">PayFlow v0.2.0 &#183; C5 Monitor</div>
        </div>
        <div id="status-pill" class="status-pill status-disconnected">&#x1F534; Disconnected</div>
    </div>

    <div class="main-grid">
        <div class="panel">
            <div class="panel-title">Coordinator Ring</div>
            <div id="coord-ring"></div>
            <div id="election-banner" class="election-banner">&#x26A1; ELECTION IN PROGRESS</div>
        </div>

        <div class="panel">
            <div class="panel-title">Worker Health</div>
            <div id="worker-grid" class="worker-grid"></div>
        </div>
    </div>

    <div class="bottom-grid">
        <div class="panel">
            <div class="panel-title">Task Queue Depth</div>
            <div class="queue-bar-container">
                <div id="queue-fill" class="queue-bar-fill queue-green" style="width:0%"></div>
            </div>
            <div id="queue-label" class="queue-label">Queue empty &#x2713;</div>
        </div>

        <div class="panel">
            <div class="panel-title">Throughput</div>
            <div class="throughput-container" id="spark-container"></div>
            <div id="throughput-value" class="throughput-value">0.0</div>
            <div class="throughput-unit">tasks / min</div>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            var wsURL = (location.protocol === "https:" ? "wss:" : "ws:") + "//" + location.host + "/ws";
            var ws = null;
            var reconnectDelay = 3000;
            var maxReconnectDelay = 30000;
            var lastSnapshotTime = null;
            var throughputHistory = [];
            var MAX_HISTORY = 20;
            var headerInterval = null;

            function connect() {
                console.log("[PayFlow] connecting to " + wsURL);
                ws = new WebSocket(wsURL);

                ws.onopen = function() {
                    console.log("[PayFlow] connected");
                    reconnectDelay = 3000;
                    updateStatusPill("live", 0);
                };

                ws.onmessage = function(event) {
                    try {
                        var msg = JSON.parse(event.data);
                        lastSnapshotTime = new Date();
                        if (msg.type === "snapshot" && msg.data) {
                            updateAll(msg.data);
                        } else if (msg.type === "ping") {
                            updateHeader(null);
                        }
                    } catch (e) {
                        console.error("[PayFlow] parse error:", e);
                    }
                };

                ws.onclose = function() {
                    console.log("[PayFlow] disconnected, reconnecting in " + reconnectDelay + "ms");
                    updateStatusPill("disconnected", 0);
                    setTimeout(connect, reconnectDelay);
                    reconnectDelay = Math.min(reconnectDelay * 1.5, maxReconnectDelay);
                };

                ws.onerror = function(err) {
                    console.error("[PayFlow] WebSocket error:", err);
                    ws.close();
                };
            }

            // Update header status pill every second
            headerInterval = setInterval(function() {
                if (!lastSnapshotTime) return;
                var ageSecs = (new Date() - lastSnapshotTime) / 1000;
                if (ws && ws.readyState === WebSocket.OPEN) {
                    if (ageSecs > 30) {
                        updateStatusPill("stale", ageSecs);
                    } else {
                        updateStatusPill("live", ageSecs);
                    }
                }
            }, 1000);

            function updateStatusPill(state, ageSecs) {
                var pill = document.getElementById("status-pill");
                var ageStr = ageSecs > 0 ? Math.round(ageSecs) + "s ago" : "";
                while (pill.firstChild) pill.removeChild(pill.firstChild);

                if (state === "live") {
                    pill.className = "status-pill status-live";
                    pill.textContent = "\uD83D\uDFE2 Live \u00B7 scraped " + ageStr;
                } else if (state === "stale") {
                    pill.className = "status-pill status-stale";
                    pill.textContent = "\uD83D\uDFE1 Stale \u00B7 " + ageStr;
                } else {
                    pill.className = "status-pill status-disconnected";
                    pill.textContent = "\uD83D\uDD34 Disconnected";
                }
            }

            function updateAll(d) {
                updateCoordinators(d);
                updateWorkers(d);
                updateQueue(d);
                updateThroughput(d);
            }

            function updateHeader(d) {
                // Header is updated by the interval timer
            }

            function updateCoordinators(d) {
                var container = document.getElementById("coord-ring");
                while (container.firstChild) container.removeChild(container.firstChild);

                var hasLeader = false;

                var coords = d.coordinators || [];
                for (var i = 0; i < coords.length; i++) {
                    var c = coords[i];
                    if (c.state === "LEADER") hasLeader = true;

                    var row = document.createElement("div");
                    row.className = "coord-row" + (c.state === "DEAD" ? " dead" : "");

                    var icon = document.createElement("span");
                    icon.className = "coord-icon";
                    if (c.state === "LEADER") icon.textContent = "\u2605";
                    else if (c.state === "CANDIDATE") icon.textContent = "\u25CE";
                    else if (c.state === "DEAD") icon.textContent = "\u2717";
                    else icon.textContent = "\u25CB";

                    var info = document.createElement("div");
                    info.className = "coord-info";

                    var name = document.createElement("div");
                    name.className = "coord-name";
                    name.textContent = c.node_id;

                    var epoch = document.createElement("div");
                    epoch.className = "coord-epoch";
                    epoch.textContent = "epoch: " + c.epoch;

                    info.appendChild(name);
                    info.appendChild(epoch);

                    var badge = document.createElement("span");
                    badge.className = "badge";
                    if (c.state === "LEADER") { badge.className += " badge-leader"; badge.textContent = "LEADER"; }
                    else if (c.state === "FOLLOWER") { badge.className += " badge-follower"; badge.textContent = "FOLLOWER"; }
                    else if (c.state === "CANDIDATE") { badge.className += " badge-candidate"; badge.textContent = "CANDIDATE"; }
                    else { badge.className += " badge-dead"; badge.textContent = "DEAD"; }

                    row.appendChild(icon);
                    row.appendChild(info);
                    row.appendChild(badge);
                    container.appendChild(row);
                }

                var banner = document.getElementById("election-banner");
                if (!hasLeader && coords.length > 0) {
                    banner.className = "election-banner visible";
                } else {
                    banner.className = "election-banner";
                }
            }

            function updateWorkers(d) {
                var container = document.getElementById("worker-grid");
                var workers = d.workers || [];

                // Reuse or create cards
                while (container.children.length > workers.length) {
                    container.removeChild(container.lastChild);
                }

                for (var i = 0; i < workers.length; i++) {
                    var w = workers[i];
                    var card = container.children[i];
                    var isNew = false;

                    if (!card) {
                        card = document.createElement("div");
                        card.className = "worker-card";
                        container.appendChild(card);
                        isNew = true;
                    }

                    // Clear card
                    while (card.firstChild) card.removeChild(card.firstChild);

                    card.className = "worker-card" + (!w.alive ? " dead-border" : "");

                    var nameEl = document.createElement("div");
                    nameEl.className = "worker-name";
                    nameEl.textContent = w.worker_id;

                    var badgeEl = document.createElement("div");
                    badgeEl.className = "worker-badge";
                    var badgeSpan = document.createElement("span");
                    badgeSpan.className = "badge " + (w.alive ? "badge-alive" : "badge-worker-dead");
                    badgeSpan.textContent = w.alive ? "ALIVE" : "DEAD";
                    badgeEl.appendChild(badgeSpan);

                    var tasksEl = document.createElement("div");
                    tasksEl.className = "worker-stat";
                    tasksEl.textContent = w.alive ? (w.tasks_done + " done") : "\u2014";

                    var p99El = document.createElement("div");
                    p99El.className = "worker-stat";
                    p99El.textContent = w.alive && w.p99_ms > 0 ? ("p99: " + w.p99_ms.toFixed(0) + "ms") : "\u2014";

                    var p50El = document.createElement("div");
                    p50El.className = "worker-stat";
                    p50El.textContent = w.alive && w.p50_ms > 0 ? ("p50: " + w.p50_ms.toFixed(0) + "ms") : "\u2014";

                    var seenEl = document.createElement("div");
                    seenEl.className = "worker-stat";
                    seenEl.textContent = "seen " + Math.round(w.last_seen_secs || 0) + "s ago";

                    card.appendChild(nameEl);
                    card.appendChild(badgeEl);
                    card.appendChild(tasksEl);
                    card.appendChild(p99El);
                    card.appendChild(p50El);
                    card.appendChild(seenEl);

                    // Flash effect on update
                    if (!isNew) {
                        var flashClass = w.alive ? "flash-alive" : "flash-dead";
                        card.classList.add(flashClass);
                        (function(c, fc) {
                            setTimeout(function() { c.classList.remove(fc); }, 500);
                        })(card, flashClass);
                    }
                }
            }

            function updateQueue(d) {
                var depth = d.queue_depth || 0;
                var maxDisplay = 100;
                var pct = Math.min((depth / maxDisplay) * 100, 100);

                var fill = document.getElementById("queue-fill");
                fill.style.width = pct + "%";

                // Color thresholds
                fill.className = "queue-bar-fill";
                if (depth >= 60) fill.classList.add("queue-red");
                else if (depth >= 20) fill.classList.add("queue-amber");
                else fill.classList.add("queue-green");

                var label = document.getElementById("queue-label");
                if (depth === 0) {
                    label.textContent = "Queue empty \u2713";
                } else {
                    label.textContent = depth + " tasks queued";
                }
            }

            function updateThroughput(d) {
                var val = d.throughput_per_min || 0;
                throughputHistory.push(val);
                if (throughputHistory.length > MAX_HISTORY) {
                    throughputHistory.shift();
                }

                // Find max for normalization
                var maxVal = 1;
                for (var i = 0; i < throughputHistory.length; i++) {
                    if (throughputHistory[i] > maxVal) maxVal = throughputHistory[i];
                }

                var container = document.getElementById("spark-container");
                // Ensure we have exactly MAX_HISTORY bars
                while (container.children.length > MAX_HISTORY) {
                    container.removeChild(container.firstChild);
                }
                while (container.children.length < MAX_HISTORY) {
                    var bar = document.createElement("div");
                    bar.className = "spark-bar";
                    bar.style.height = "2px";
                    container.appendChild(bar);
                }

                // Update bar heights
                var startIdx = MAX_HISTORY - throughputHistory.length;
                for (var j = 0; j < MAX_HISTORY; j++) {
                    var barEl = container.children[j];
                    if (j < startIdx) {
                        barEl.style.height = "2px";
                    } else {
                        var dataIdx = j - startIdx;
                        var h = Math.max(2, (throughputHistory[dataIdx] / maxVal) * 58);
                        barEl.style.height = h + "px";
                    }
                }

                var valueEl = document.getElementById("throughput-value");
                valueEl.textContent = val.toFixed(1);
            }

            connect();
        })();
    </script>
</body>
</html>
